<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <title>Yugioh Deck Constructor</title>
  </head>

  <body>
    <noscript>
      <strong
        >We're sorry but Yugioh Deck Constructor doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>

    <div id="app"></div>

    <!-- BACKGROUND IMAGE -->
    <img
      id="background_image"
      src="https://www.duelingbook.com/images/circuit_board_small.jpg"
    />
    <!-- GREEN LINES -->
    <div id="greenlines">
      <div id="greenlines1">
        <img
          src="https://images.duelingbook.com/svg/greenlines.svg"
          alt="Green Lines"
        />
      </div>
      <div id="greenlines2">
        <img
          src="https://images.duelingbook.com/svg/greenlines.svg"
          alt="Green Lines"
        />
      </div>
    </div>
    <style>
      body {
        background-color: black;
        position: relative;
      }

      #background_image {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        width: max(1000px, 100%);
        height: 100%;
        opacity: 0.5;
        object-fit: cover;
      }

      #greenlines {
        display: block;
        position: absolute;
        transform-style: preserve-3d;
        perspective: 515px;
        opacity: 0.7;
        overflow: hidden;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        width: max(1000px, 100%);
        background: rgba(0, 0, 0, 70%);
      }

      #greenlines1,
      #greenlines2 {
        width: 900px;
      }

      #greenlines1 {
        transform: translate3d(-2px, 1000px, -1750px) rotateX(86.5deg)
          scaleX(7.1) scaleY(7);
      }

      #greenlines2 {
        transform: translate3d(-2px, -1000px, -2000px) rotateX(86.5deg)
          scaleX(7.1) scaleY(7);
      }
    </style>
    <!-- built files will be auto injected -->
  </body>
</html>
